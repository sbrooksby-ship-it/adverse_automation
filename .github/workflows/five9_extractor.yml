name: Five9 Transcript Extractor

on:
  schedule:
    - cron: '37 * * * *'  # Runs once an hour, at minute 37 (UTC)
  workflow_dispatch:      # Allows manual triggers from GitHub UI

# Prevents multiple concurrent runs from interfering with each other
concurrency:
  group: five9-extractor-run
  cancel-in-progress: false

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'  # Caches pip packages to speed up step execution

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Restore Google OAuth Token
      run: |
        echo "${{ secrets.TOKEN_PICKLE }}" | tr -d ' \t\r\n' | base64 --decode > token.pickle

    - name: Restore Google Client Secret
      run: |
        echo "${{ secrets.CLIENT_SECRET_JSON }}" | tr -d ' \t\r\n' | base64 --decode > client_secret.json

    # Cache Playwright login state so it doesn't have to log in from scratch every hour
    - name: Cache Playwright State
      uses: actions/cache@v3
      with:
        path: state.json
        key: five9-state-${{ github.run_id }}
        restore-keys: |
          five9-state-

    - name: Execute Extraction Script
      env:
        FIVE9_USER: ${{ secrets.FIVE9_USER }}
        FIVE9_PASS: ${{ secrets.FIVE9_PASS }}
        GOOGLE_FOLDER_ID: ${{ secrets.GOOGLE_FOLDER_ID }}
        HEADLESS_MODE: "true"
      run: |
        python fetch_transcripts.py

    # ALWAYS upload screenshots (both error and debug) so we can see what the bot sees
    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: five9-screenshots
        path: |
          error_screenshot.png
          debug_grid_state.png
        retention-days: 7
